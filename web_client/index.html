<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钓鱼 (Fishing) - 沉浸式对局</title>
    <!-- 引入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden; /* 防止滚动 */
            touch-action: none; /* 防止移动端下拉刷新影响搓牌 */
        }

        /* 牌桌纹理 */
        .poker-table {
            background: radial-gradient(circle, #35654d 0%, #204030 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.6);
            border: 15px solid #3e2723;
            border-radius: 100px;
            position: relative;
        }

        /* 扑克牌样式 */
        .card {
            background-color: white;
            border-radius: 6px;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            user-select: none;
            transition: transform 0.2s;
        }
        .card-sm:hover {
            transform: translateY(-5px);
        }
        .card-red { color: #d32f2f; }
        .card-black { color: #212121; }
        
        .card-back {
            background: repeating-linear-gradient(
                45deg,
                #606dbc,
                #606dbc 10px,
                #465298 10px,
                #465298 20px
            );
            border: 2px solid white;
        }

        /* 玻璃拟态 */
        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 咪牌拇指遮挡效果 */
        .thumb-mask {
            background: radial-gradient(circle at center, #d1a980 0%, #8d6e63 100%);
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            border: 2px solid rgba(0,0,0,0.1);
        }

        /* 历史记录滚动条 */
        .history-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .history-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .history-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        .winner-glow {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
            border-color: #fbbf24 !important;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 图标组件 ---
        const IconUser = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        );

        const IconHistory = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M12 7v5l4 2"></path>
            </svg>
        );

        const IconEye = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        );

        const IconSettings = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        );

        const IconChevronDown = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        );

        const IconChevronUp = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        );

        const IconXCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
        );

        // --- 扑克牌组件 ---
        const PlayingCard = ({ name, suit, hidden, folded, size = "md", showThumb = false, onThumbClick, onClick }) => {
            const [imgError, setImgError] = useState(false);

            // 重置 error 状态当牌改变时
            useEffect(() => {
                setImgError(false);
            }, [name, suit, hidden]);

            const getCardImage = () => {
                if (hidden) return "https://deckofcardsapi.com/static/img/back.png";

                // 映射花色
                let sCode = '';
                if (suit === '♥' || suit === 'Hearts') sCode = 'H';
                else if (suit === '♦' || suit === 'Diamonds') sCode = 'D';
                else if (suit === '♠' || suit === 'Spades') sCode = 'S';
                else if (suit === '♣' || suit === 'Clubs') sCode = 'C';
                
                // 映射点数
                let nCode = '';
                if (name === '10') nCode = '0';
                else if (name === 'A') nCode = 'A';
                else if (name === 'J') nCode = 'J';
                else if (name === 'Q') nCode = 'Q';
                else if (name === 'K') nCode = 'K';
                else nCode = name;

                // 处理大小王
                if (name === '大王') return "https://deckofcardsapi.com/static/img/X2.png"; // Red Joker
                if (name === '小王') return "https://deckofcardsapi.com/static/img/X1.png"; // Black Joker

                return `https://deckofcardsapi.com/static/img/${nCode}${sCode}.png`;
            };

            const isRed = suit === '♥' || suit === '♦' || suit === '红';
            let suitIcon = suit;
            if(suit === 'Hearts') suitIcon = '♥';
            if(suit === 'Diamonds') suitIcon = '♦';
            if(suit === 'Spades') suitIcon = '♠';
            if(suit === 'Clubs') suitIcon = '♣';

            // CSS 渲染逻辑 (Fallback)
            const renderCSSCard = () => {
                if (hidden) {
                    return (
                         <div className={`w-full h-full card-back rounded-md border-2 border-white`}></div>
                    );
                }

                const renderBigPatterns = () => {
                    if (size !== 'lg') return <div className="text-base sm:text-xl self-center">{suitIcon}</div>;
                    
                    // 尝试解析点数
                    let count;
                    const n = name;
                    if (n === 'A') count = 1;
                    else if (['J', 'Q', 'K'].includes(n)) count = 11;
                    else if (n === '大王' || n === '小王') count = 20;
                    else count = parseInt(n);
                    
                    if (isNaN(count)) count = 1;

                    const getPips = (cnt) => {
                        const pips = [];
                        const P = ({ key, style, rotate }) => (
                             <div key={key} className="absolute flex items-center justify-center w-8 h-8" style={style}>
                                <div style={{ transform: rotate ? 'rotate(180deg)' : 'none' }}>{suitIcon}</div>
                             </div>
                        );
                        // ... (简化，保留核心布局逻辑以免代码过长，或者如果图片加载失败才显示这个)
                        // 为节省 Tokens，这里只保留简单的渲染，因为大概率 API 可用
                        // 如果需要完整 fallback，可以保留之前的代码
                        return <div className="text-6xl self-center">{name}</div>; 
                    };

                    return (
                        <div className="flex-1 relative w-full h-full overflow-hidden flex flex-col justify-center items-center">
                             {getPips(count)}
                        </div>
                    );
                };

                return (
                    <div className={`w-full h-full bg-white rounded-md flex flex-col justify-between p-1 ${isRed ? 'text-red-600' : 'text-black'}`}>
                        <div className="flex flex-col items-center leading-none w-6">
                            <div>{name}</div>
                            <div className="text-xs mt-0.5">{suitIcon}</div>
                        </div>
                        {renderBigPatterns()}
                        <div className="flex flex-col items-center leading-none self-end transform rotate-180 w-6">
                            <div>{name}</div>
                            <div className="text-xs mt-0.5">{suitIcon}</div>
                        </div>
                    </div>
                );
            };

            const cardClasses = size === 'lg' 
                ? 'w-48 h-72 rounded-xl shadow-2xl' 
                : 'w-10 h-14 sm:w-12 sm:h-16 card-sm';

            return (
                <div 
                    className={`card-container ${cardClasses} relative transition-transform duration-200 ${folded ? 'opacity-50 grayscale' : ''}`}
                    onClick={onClick}
                >
                    {!imgError ? (
                        <img 
                            src={getCardImage()} 
                            alt={`${name}${suit}`}
                            className="w-full h-full object-contain rounded-lg shadow-md bg-white"
                            onError={() => setImgError(true)}
                        />
                    ) : (
                        renderCSSCard()
                    )}

                    {size === 'lg' && showThumb && (
                        <div 
                            onClick={(e) => { e.stopPropagation(); onThumbClick && onThumbClick(); }}
                            className="absolute top-0 left-0 w-20 h-24 thumb-mask rounded-br-full cursor-pointer z-50 flex items-center justify-center"
                            title="点击移开手指"
                        >
                            <span className="text-xs text-white/50 font-bold -rotate-45 select-none">点击移开</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- 咪牌模式组件 ---
        const SqueezeMode = ({ cards, onClose }) => {
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [thumbHidden, setThumbHidden] = useState(false);
            
            const handlePointerDown = (e) => { setIsDragging(true); };

            useEffect(() => {
                const handlePointerMove = (e) => {
                    if (!isDragging) return;
                    setOffset(prev => ({ x: prev.x + e.movementX, y: prev.y + e.movementY }));
                };
                const handlePointerUp = () => { setIsDragging(false); };
                if (isDragging) {
                    window.addEventListener('pointermove', handlePointerMove);
                    window.addEventListener('pointerup', handlePointerUp);
                }
                return () => {
                    window.removeEventListener('pointermove', handlePointerMove);
                    window.removeEventListener('pointerup', handlePointerUp);
                }
            }, [isDragging]);

            useEffect(() => {
                setOffset({ x: 0, y: 0 });
                setThumbHidden(false);
            }, [cards]);

            if (!cards || cards.length < 2) return null;

            return (
                <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/95 backdrop-blur-md animate-in fade-in duration-200">
                    <div className="text-yellow-500 font-bold mb-8 text-xl tracking-widest flex items-center gap-2">
                        <IconEye /> 沉浸搓牌模式
                    </div>
                    <div className="relative w-48 h-72">
                        {/* 底牌 (第二张) */}
                        <div className="absolute inset-0">
                            <PlayingCard name={cards[1].name} suit={cards[1].suit} size="lg" showThumb={!thumbHidden} onThumbClick={() => setThumbHidden(true)} />
                        </div>
                        {/* 顶牌 (第一张) - 可拖动 */}
                        <div 
                            className="absolute inset-0 cursor-move shadow-[0_20px_50px_rgba(0,0,0,0.5)] transition-transform duration-75 ease-out"
                            style={{ transform: `translate(${offset.x}px, ${offset.y}px) rotate(${offset.x * 0.05}deg)` }}
                            onPointerDown={handlePointerDown}
                        >
                            <PlayingCard name={cards[0].name} suit={cards[0].suit} size="lg" />
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
                                {!isDragging && offset.x === 0 && <span className="text-black font-bold text-lg">按住拖动</span>}
                            </div>
                        </div>
                    </div>
                    <button onClick={onClose} className="mt-8 px-8 py-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-full text-white transition-all">
                        完成看牌
                    </button>
                </div>
            );
        };

        // --- 玩家座位组件 ---
        const PlayerSeat = ({ player, position, winner, isSqueezeEnabled, onOpenSqueeze }) => {
            const [showHistory, setShowHistory] = useState(false);
            const isFolded = player.folded;
            const isWinner = winner === player.name;
            const isTurn = player.isTurn;
            
            // 坐标定义
            const positionStyles = {
                'bottom': 'bottom-8 left-1/2 -translate-x-1/2',
                'left': 'top-1/2 left-8 -translate-y-1/2',
                'right': 'top-1/2 right-8 -translate-y-1/2',
                'top': 'top-8 left-1/2 -translate-x-1/2',
                'top-left': 'top-16 left-24',
                'top-right': 'top-16 right-24',
                'bottom-left': 'bottom-24 left-32',
                'bottom-right': 'bottom-24 right-32'
            };

            const styleClass = positionStyles[position] || positionStyles.top;

            // 解析手牌
            let cards = [];
            let handStr = player.hand;
            // 如果是 Human 且开启了搓牌模式，且没有显示全部手牌（round_end 会显示全部），则只显示第一张
            // 这里需要父组件控制 hand 的传入。
            // 简单的解析逻辑：
            if (handStr && handStr !== "[Hidden]") {
                 // 简单正则提取: Symbol + Name (e.g. [♥3, ♦Q])
                 const matches = [...handStr.matchAll(/([♥♦♠♣]?)([^, \[\]♥♦♠♣]+)/g)];
                 if (matches.length > 0) {
                     cards = matches.map(m => {
                        let suit = m[1] || '';
                        const name = m[2];
                        if (name === '大王') suit = '红';
                        return { name, suit };
                     });
                 }
            }

            const showBack = !cards || cards.length === 0;

            // 搓牌逻辑：如果是 Human，开启了搓牌，且有牌，且不是全展示（比如 round_end）
            // 这里我们依赖 props 来决定是否只展示一张
            // 我们假设父组件已经处理好了 cards 数据，或者在这里处理
            // 为了简单，如果 isSqueezeEnabled 为真，且是本人(position==='bottom')，且cards有2张，且游戏未结束(winner未出)，则隐藏第二张
            let displayCards = cards;
            let showEye = false;

            if (position === 'bottom' && isSqueezeEnabled && cards.length >= 2 && !winner) {
                // 仅展示第一张，第二张隐藏或者是背面
                // 需求："每次发完牌桌面只展示其中一张牌，玩家可以点开牌旁边的眼睛按钮进入搓牌界面"
                // 所以这里只渲染一张 PlayingCard (或者第二张是背面)
                // 但为了布局不跳动，我们渲染两张，第二张强制背面或者隐藏?
                // "桌面只展示其中一张牌" -> 我们可以只渲染一张，或者渲染两张但第二张是背面
                // 结合"点开眼睛进入搓牌"，那眼睛按钮应该在旁边
                showEye = true;
                // 我们让第二张显示为背面
                displayCards = [cards[0], { ...cards[1], _forceBack: true }];
            }

            return (
                <div className={`absolute ${styleClass} flex flex-col items-center transition-all duration-300 z-10 ${isFolded ? 'opacity-60 scale-90' : ''} ${isWinner ? 'scale-110 z-20' : ''}`}>
                    
                    {/* 最近行动气泡 */}
                    {player.lastAction && (
                        <div className="mb-2 bg-white/90 text-black text-xs font-bold px-2 py-1 rounded shadow-lg animate-in fade-in slide-in-from-bottom-2 whitespace-nowrap">
                            {player.lastAction}
                        </div>
                    )}
                    
                    {/* 头像区域 */}
                    <div className={`relative w-16 h-16 rounded-full border-4 flex items-center justify-center bg-gray-800 shadow-lg z-10 
                        ${isWinner ? 'winner-glow bg-red-900/50' : 'border-gray-600'}
                        ${isTurn ? 'ring-4 ring-yellow-400/50 border-yellow-400' : ''}`}>
                        <IconUser size={32} className={isWinner ? "text-yellow-400" : "text-gray-400"} />
                        {isFolded && (
                            <div className="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center">
                                <span className="text-xs font-bold text-red-400">FOLD</span>
                            </div>
                        )}
                        <div className="absolute -bottom-2 bg-gray-900 border border-yellow-600 px-2 py-0.5 rounded-full text-xs text-yellow-500 font-mono flex items-center shadow-md whitespace-nowrap">
                            <span className="mr-1">ⓒ</span>{player.chips}
                        </div>
                    </div>

                    {/* 名字和历史开关 */}
                    <div className="mt-3 flex flex-col items-center relative">
                        <div className="bg-black/40 px-3 py-1 rounded text-sm font-semibold backdrop-blur-sm text-gray-200 mb-1 whitespace-nowrap">
                            {player.name}
                        </div>
                        
                        <button 
                            onClick={() => setShowHistory(!showHistory)}
                            className="text-[10px] text-gray-400 hover:text-white flex items-center bg-black/40 px-2 rounded-full transition-colors"
                        >
                            History
                            {showHistory ? <IconChevronUp size={10} className="ml-1"/> : <IconChevronDown size={10} className="ml-1"/>}
                        </button>

                        {/* 历史记录下拉面板 */}
                        {showHistory && player.history && player.history.length > 0 && (
                            <div className="absolute top-full mt-2 w-40 bg-gray-900/95 border border-gray-700 rounded-lg p-2 shadow-xl z-50 text-xs text-gray-300 max-h-32 overflow-y-auto history-scroll">
                                {player.history.map((action, idx) => (
                                    <div key={idx} className="border-b border-gray-800 py-1 last:border-0">
                                        {action}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 手牌 */}
                    <div className="flex space-x-1 mt-2 items-center">
                        {showBack ? (
                             <>
                                <PlayingCard hidden={true} folded={isFolded} />
                                <PlayingCard hidden={true} folded={isFolded} />
                             </>
                        ) : (
                             <>
                                {displayCards.map((c, i) => (
                                    <PlayingCard 
                                        key={i} 
                                        name={c.name} 
                                        suit={c.suit} 
                                        folded={isFolded} 
                                        hidden={c._forceBack} 
                                    />
                                ))}
                                {/* 搓牌眼睛按钮 */}
                                {showEye && (
                                    <button 
                                        onClick={onOpenSqueeze}
                                        className="ml-2 p-2 bg-yellow-600 hover:bg-yellow-500 rounded-full shadow-lg transition-transform hover:scale-110"
                                        title="进入搓牌模式"
                                    >
                                        <IconEye size={16} />
                                    </button>
                                )}
                             </>
                        )}
                    </div>
                </div>
            );
        };

        const HistoryModal = ({ isOpen, onClose, history }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-lg mx-4 flex flex-col max-h-[80vh] shadow-2xl">
                        <div className="flex items-center justify-between p-4 border-b border-gray-800">
                            <h3 className="text-lg font-bold flex items-center gap-2">
                                <IconHistory className="text-yellow-500"/> 对局记录
                            </h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-white">
                                <IconXCircle />
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 history-scroll space-y-2">
                            {history.length === 0 ? (
                                <div className="text-center text-gray-500 py-8">暂无记录</div>
                            ) : (
                                history.map((log, idx) => (
                                    <div key={idx} className="text-sm text-gray-300 border-b border-gray-800/50 pb-1 last:border-0">
                                        {log}
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 主应用 ---
        const App = () => {
            // 游戏状态
            const [status, setStatus] = useState('disconnected');
            const [gameState, setGameState] = useState({
                round: 0,
                pot: 0,
                players: [],
                logs: [],
                winner: null,
                activePlayers: []
            });
            const [actionRequest, setActionRequest] = useState(null); // { phase, pot, any_bet, ... }
            const [betAmount, setBetAmount] = useState(0);
            
            // UI 状态
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [enableSqueeze, setEnableSqueeze] = useState(false);
            const [isSqueezing, setIsSqueezing] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [isWaitingForReady, setIsWaitingForReady] = useState(false);

            const ws = useRef(null);

            useEffect(() => {
                connect();
                return () => {
                    if (ws.current) ws.current.close();
                };
            }, []);

            const connect = () => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

                socket.onopen = () => {
                    setStatus('connected');
                    console.log('Connected to WebSocket');
                };

                socket.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                };

                socket.onclose = () => {
                    setStatus('disconnected');
                    console.log('Disconnected');
                    setTimeout(connect, 3000);
                };

                ws.current = socket;
            };

            const handleMessage = (msg) => {
                const { type, data } = msg;
                console.log("Received:", type, data);

                if (type === 'round_start') {
                    setGameState(prev => ({
                        ...prev,
                        round: data.round,
                        pot: data.pot,
                        players: data.players.map(p => ({
                            ...p, 
                            history: [], // 新一轮清空历史
                            lastAction: null,
                            isTurn: false
                        })),
                        winner: null,
                        logs: []
                    }));
                    setActionRequest(null);
                    setIsSqueezing(false);
                    setIsWaitingForReady(false);
                } 
                else if (type === 'action') {
                    // 更新玩家状态和底池
                    setGameState(prev => {
                        const newPlayers = prev.players.map(p => {
                            if (p.name === data.player) {
                                return {
                                    ...p,
                                    chips: data.chips,
                                    lastAction: `${data.action} ${data.amount > 0 ? data.amount : ''}`,
                                    history: [...(p.history || []), `${data.action} ${data.amount > 0 ? data.amount : ''}`],
                                    isTurn: false
                                };
                            }
                            return p;
                        });
                        return {
                            ...prev,
                            pot: data.pot,
                            players: newPlayers,
                            logs: [...prev.logs, data.log]
                        };
                    });
                } 
                else if (type === 'request_action') {
                    // data: { player, phase, pot, chips, hand, hand_pts, any_bet }
                    setActionRequest(data);
                    setBetAmount(Math.min(data.pot, data.chips)); // 默认下注额为底池或最大筹码
                    
                    // 标记当前行动者
                    setGameState(prev => ({
                        ...prev,
                        players: prev.players.map(p => ({
                            ...p,
                            isTurn: p.name === data.player
                        }))
                    }));
                } 
                else if (type === 'round_end') {
                    setGameState(prev => ({
                        ...prev,
                        winner: data.winner,
                        pot: data.pot,
                        players: data.players.map(p => {
                            // 保留历史记录
                            const oldP = prev.players.find(op => op.name === p.name);
                            return { ...p, history: oldP ? oldP.history : [], lastAction: null, isTurn: false };
                        }),
                        logs: [...prev.logs, ...data.logs]
                    }));
                    setActionRequest(null);
                }
                else if (type === 'wait_ready') {
                    // 可以在这里显示“下一局”按钮
                    setIsWaitingForReady(true);
                }
                else if (type === 'game_over') {
                    alert("游戏结束: " + data);
                }
            };

            const sendAction = (action, amount = 0) => {
                if (!ws.current) return;
                ws.current.send(JSON.stringify({
                    type: 'action',
                    data: { action, amount: parseInt(amount) }
                }));
                setActionRequest(null); // 隐藏控制条，等待服务器响应
            };

            const startGame = () => {
                if (!ws.current) return;
                ws.current.send(JSON.stringify({ type: 'start_game', data: {} }));
            };

            const nextRound = () => {
                if (!ws.current) return;
                ws.current.send(JSON.stringify({ type: 'next_round', data: {} }));
            };

            // 计算座位位置
            const getSeatPosition = (index, total) => {
                // 假设 Human 总是最后一个加入列表 (或者按名字找)
                // 这里我们每次 render 都找一下 Human 的 index
                const humanIndex = gameState.players.findIndex(p => p.name === 'Human');
                if (humanIndex === -1) return 'bottom'; // Fallback

                // 重新排序，Human 在 0 (bottom)
                // 相对位置 = (index - humanIndex + total) % total
                const relativeIndex = (index - humanIndex + total) % total;

                if (relativeIndex === 0) return 'bottom';
                
                // 根据总人数布局
                if (total === 2) {
                    return relativeIndex === 1 ? 'top' : 'bottom';
                }
                if (total === 3) {
                    if (relativeIndex === 1) return 'top-right';
                    if (relativeIndex === 2) return 'top-left';
                }
                if (total === 4) {
                    if (relativeIndex === 1) return 'right';
                    if (relativeIndex === 2) return 'top';
                    if (relativeIndex === 3) return 'left';
                }
                // 6人桌
                if (total >= 5) {
                    if (relativeIndex === 1) return 'bottom-right';
                    if (relativeIndex === 2) return 'top-right';
                    if (relativeIndex === 3) return 'top';
                    if (relativeIndex === 4) return 'top-left';
                    if (relativeIndex === 5) return 'bottom-left';
                }
                
                return 'top'; // Default
            };

            const renderControls = () => {
                // 如果游戏结束，显示下一局按钮
                if (gameState.winner || isWaitingForReady) {
                    return (
                        <div className="fixed bottom-32 left-1/2 -translate-x-1/2 z-50">
                            <button 
                                onClick={nextRound}
                                className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 animate-bounce"
                            >
                                下一局 (Next Round)
                            </button>
                        </div>
                    );
                }

                if (!actionRequest) return null;

                const { phase, any_bet, pot } = actionRequest;
                
                // initial 阶段: 只能 bet 或 fold (如果 any_bet=False, 实际上只能 bet, 但 chip_game.py 允许 fold)
                // follow 阶段: check 或 bet (如果 any_bet=True, bet 变成 call/raise 逻辑，这里简化为 "带")
                // 需求: "下注按钮在第二次轮到自己下注时变为“带”" -> phase == 'follow'
                
                const isFollow = phase === 'follow';
                const showDai = isFollow; 
                const showBet = !isFollow;
                
                // 如果是 initial 且 any_bet=False，其实是 "开池" (Bet)
                // 如果是 initial 且 any_bet=True，其实是 "反打" (Bet) -> 依然显示 Bet
                
                // 按钮组
                return (
                    <div className="fixed bottom-36 left-1/2 -translate-x-1/2 flex items-center gap-4 z-50">
                        {/* 弃牌总是可用 */}
                        <button 
                            onClick={() => sendAction('fold')}
                            className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105"
                        >
                            弃牌 (Fold)
                        </button>

                        {/* 过牌 (Check) - 仅在 follow 阶段且没人下注时，或者 initial 阶段没人下注时(如果规则允许)可用 
                            但在 chip_game.py 中，initial 阶段不允许 check (除非改了规则)。
                            follow 阶段，如果 any_bet=False，可以 Check。如果 any_bet=True，Check 其实是 Fold? 不，ChipGame 里没这逻辑。
                            Wait, chip_game.py: if action not in ["check", "bet"]: return "check" (default)
                            如果别人下注了，我想跟，必须 Bet pot。
                            如果我想 Check，只有在没人下注时。
                        */}
                        {!any_bet && phase === 'follow' && (
                             <button 
                                onClick={() => sendAction('check')}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105"
                            >
                                过牌 (Check)
                            </button>
                        )}

                        {/* 下注 / 带 */}
                        {showDai ? (
                            <button 
                                onClick={() => sendAction('bet', pot)}
                                className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 flex flex-col items-center leading-none"
                            >
                                <span className="text-lg">带 (Dai)</span>
                                <span className="text-xs opacity-80">{pot}</span>
                            </button>
                        ) : (
                            <div className="flex items-center bg-gray-900/80 rounded-full p-1 border border-yellow-500/50 backdrop-blur-md">
                                <input 
                                    type="number" 
                                    value={betAmount}
                                    onChange={(e) => setBetAmount(e.target.value)}
                                    className="w-20 bg-transparent text-white text-center font-bold outline-none border-r border-gray-600 mr-2"
                                />
                                <button 
                                    onClick={() => sendAction('bet', betAmount)}
                                    className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transform transition hover:scale-105"
                                >
                                    下注 (Bet)
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            // 获取我的手牌用于搓牌
            const getMyCards = () => {
                const me = gameState.players.find(p => p.name === 'Human');
                if (!me || !me.hand || me.hand === "[Hidden]") return [];
                const matches = [...me.hand.matchAll(/([♥♦♠♣]?)([^, \[\]♥♦♠♣]+)/g)];
                return matches.map(m => {
                    let suit = m[1] || '';
                    const name = m[2];
                    if (name === '大王') suit = '红';
                    return { name, suit };
                });
            };

            return (
                <div className="relative w-screen h-screen bg-gray-900 flex items-center justify-center p-4">
                    {/* 背景桌子 */}
                    <div className="w-full h-full max-w-7xl max-h-[90vh] poker-table relative">
                        
                        {/* 顶部信息栏 */}
                        <div className="absolute top-8 left-1/2 -translate-x-1/2 bg-black/40 backdrop-blur-md px-6 py-2 rounded-full border border-white/10 flex items-center gap-6 z-20">
                            <div className="flex flex-col items-center">
                                <span className="text-xs text-gray-400 uppercase tracking-wider">Pot</span>
                                <span className="text-2xl font-bold text-yellow-400">ⓒ {gameState.pot}</span>
                            </div>
                            <div className="w-px h-8 bg-white/20"></div>
                            <div className="flex flex-col items-center">
                                <span className="text-xs text-gray-400 uppercase tracking-wider">Round</span>
                                <span className="text-xl font-bold text-white">#{gameState.round}</span>
                            </div>
                        </div>

                        {/* 设置按钮 */}
                        <div className="absolute top-6 left-6 z-30">
                             <div className="relative">
                                <button onClick={() => setSettingsOpen(!settingsOpen)} className="p-2 bg-black/40 rounded-full hover:bg-black/60 transition-colors">
                                    <IconSettings className="text-gray-300" />
                                </button>
                                {settingsOpen && (
                                    <div className="absolute top-full left-0 mt-2 w-48 bg-gray-800 border border-gray-600 rounded-lg p-3 shadow-xl">
                                        <h4 className="text-sm font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">设置</h4>
                                        <label className="flex items-center justify-between cursor-pointer">
                                            <span className="text-sm text-gray-200">搓牌模式</span>
                                            <input 
                                                type="checkbox" 
                                                checked={enableSqueeze} 
                                                onChange={(e) => setEnableSqueeze(e.target.checked)}
                                                className="accent-yellow-500" 
                                            />
                                        </label>
                                    </div>
                                )}
                             </div>
                        </div>

                        {/* 历史记录按钮 */}
                        <div className="absolute top-6 right-6 z-30">
                            <button onClick={() => setShowHistoryModal(true)} className="p-2 bg-black/40 rounded-full hover:bg-black/60 transition-colors flex items-center gap-2 px-4">
                                <IconHistory className="text-gray-300" />
                                <span className="text-sm font-bold">Log</span>
                            </button>
                        </div>

                        {/* 玩家座位 */}
                        {gameState.players.map((player, index) => (
                            <PlayerSeat 
                                key={player.name} 
                                player={player} 
                                position={getSeatPosition(index, gameState.players.length)}
                                winner={gameState.winner}
                                isSqueezeEnabled={enableSqueeze}
                                onOpenSqueeze={() => setIsSqueezing(true)}
                            />
                        ))}

                        {/* 中心状态/开始按钮 - 仅当不在游戏状态且 Pot 为 0 (初始状态) 时显示，避免遮挡 Pot */}
                        {status === 'connected' && gameState.players.length === 0 && (
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center z-50">
                                <button 
                                    onClick={startGame}
                                    className="bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-4 px-12 rounded-full text-2xl shadow-[0_0_30px_rgba(234,179,8,0.5)] transform transition hover:scale-105 animate-pulse"
                                >
                                    开始游戏
                                </button>
                            </div>
                        )}

                        {/* 操作栏 */}
                        {renderControls()}
                    </div>

                    {/* 弹窗层 */}
                    <HistoryModal 
                        isOpen={showHistoryModal} 
                        onClose={() => setShowHistoryModal(false)} 
                        history={gameState.logs} 
                    />

                    {/* 搓牌层 */}
                    {isSqueezing && (
                        <SqueezeMode 
                            cards={getMyCards()} 
                            onClose={() => setIsSqueezing(false)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
